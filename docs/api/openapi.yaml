        "summary": "Create or replay a background Job",
        "description": "First request: 202 + Location. Replay: 200 + Idempotent-Replayed: true, current Job. Key TTL: 24 hours. Conflict: 409. JPEG/PNG <=10 MiB, <=25 megapixels; operations JSON <=16 KiB, 1..10 items. Content-Length required; chunked upload unsupported. Receive deadline: 30s. No authentication; knowledge of a random Job id grants access.",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{8,64}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "image": {
                    "type": "string",
                    "format": "binary"
                  },
                  "operations": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 10,
                    "items": {
                      "oneOf": [
                        {
                          "type": "object",
                          "properties": {
                            "operation": {
                              "const": "frame"
                            },
                            "params": {
                              "type": "object",
                              "properties": {
                                "style": {
                                  "enum": [
                                    "thin",
                                    "classic"
                                  ]
                                },
                                "width": {
                                  "type": "integer",
                                  "minimum": 1,
                                  "maximum": 15
                                },
                                "color": {
                                  "type": "string",
                                  "pattern": "^#[0-9A-Fa-f]{6}$"
                                }
                              },
                              "required": [],
                              "additionalProperties": false
                            }
                          },
                          "required": [
                            "operation"
                          ],
                          "additionalProperties": false
                        },
                        {
                          "type": "object",
                          "properties": {
                            "operation": {
                              "const": "filter"
                            },
                            "params": {
                              "type": "object",
                              "properties": {
                                "name": {
                                  "enum": [
                                    "sepia",
                                    "grayscale"
                                  ]
                                }
                              },
                              "required": [
                                "name"
                              ],
                              "additionalProperties": false
                            }
                          },
                          "required": [
                            "operation",
                            "params"
                          ],
                          "additionalProperties": false
                        }
                      ]
                    }
                  }
                },
                "required": [
                  "image",
                  "operations"
                ],
                "additionalProperties": false
              },
              "encoding": {
                "operations": {
                  "contentType": "application/json"
                }
              }
            }
          }
        }
      }
    },
