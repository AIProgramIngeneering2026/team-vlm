  "components": {
    "schemas": {
      "Job": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^j_[0-9a-f]{32}$"
          },
          "status": {
            "enum": [
              "created",
              "running",
              "done",
              "failed",
              "cancelled"
            ]
          },
          "operations": {
            "type": "array",
            "minItems": 1,
            "maxItems": 10,
            "items": {
              "oneOf": [
                {
                  "type": "object",
                  "properties": {
                    "operation": {
                      "const": "frame"
                    },
                    "params": {
                      "type": "object",
                      "properties": {
                        "style": {
                          "enum": [
                            "thin",
                            "classic"
                          ]
                        },
                        "width": {
                          "type": "integer",
                          "minimum": 1,
                          "maximum": 15
                        },
                        "color": {
                          "type": "string",
                          "pattern": "^#[0-9A-Fa-f]{6}$"
                        }
                      },
                      "required": [],
                      "additionalProperties": false
                    }
                  },
                  "required": [
                    "operation"
                  ],
                  "additionalProperties": false
                },
                {
                  "type": "object",
                  "properties": {
                    "operation": {
                      "const": "filter"
                    },
                    "params": {
                      "type": "object",
                      "properties": {
                        "name": {
                          "enum": [
                            "sepia",
                            "grayscale"
                          ]
                        }
                      },
                      "required": [
                        "name"
                      ],
                      "additionalProperties": false
                    }
                  },
                  "required": [
                    "operation",
                    "params"
                  ],
                  "additionalProperties": false
                }
              ]
            }
          },
          "cancel_requested": {
            "type": "boolean"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "started_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "finished_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
